services:
  - type: web
    name: formsynth
    runtime: python
    rootDir: backend
    buildCommand: |
      cd ../frontend && npm ci && npm run build
      pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
